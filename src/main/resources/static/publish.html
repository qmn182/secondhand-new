<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <!-- 新增以下这一行 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布商品 - 商家中心</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; }
        textarea { height: 100px; }
        button { background: #1890ff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .image-preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .image-preview img { width: 100px; height: 100px; object-fit: cover; border: 1px solid #ddd; }
        .message { margin-top: 15px; padding: 10px; border-radius: 4px; text-align: center; }
        .error { background: #ffebee; color: #f44336; }
        .success { background: #e8f5e9; color: #4caf50; }
    </style>
</head>
<body>
<div class="container">
    <h2>发布新商品</h2>
    <form id="publishForm">
        <div class="form-group">
            <label>商品名称 *</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label>分类</label>
            <select id="category">
                <option value="">请选择</option>
                <option value="手机">手机</option>
                <option value="电脑">电脑</option>
                <option value="图书">图书</option>
                <option value="家居">家居</option>
                <option value="其他">其他</option>
            </select>
        </div>
        <div class="form-group">
            <label>售价 *</label>
            <input type="number" step="0.01" id="price" required>
        </div>
        <div class="form-group">
            <label>原价</label>
            <input type="number" step="0.01" id="originalPrice">
        </div>
        <div class="form-group">
            <label>库存 *</label>
            <input type="number" id="stock" required>
        </div>
        <div class="form-group">
            <label>新旧程度</label>
            <select id="condition">
                <option value="全新">全新</option>
                <option value="九成新">九成新</option>
                <option value="八成新">八成新</option>
                <option value="七成新">七成新</option>
            </select>
        </div>
        <div class="form-group">
            <label>是否允许议价</label>
            <select id="negotiable">
                <option value="false">否</option>
                <option value="true">是</option>
            </select>
        </div>
        <div class="form-group">
            <label>商品描述</label>
            <textarea id="description"></textarea>
        </div>
        <div class="form-group">
            <label>商品图片（可多选）</label>
            <input type="file" id="images" multiple accept="image/*">
            <div id="preview" class="image-preview"></div>
        </div>
        <button type="button" id="submitBtn">发布商品</button>
    </form>
    <div id="message"></div>
</div>

<script>
    let uploadedImages = []; // 存储上传成功后的图片URL

    // 图片上传预览
    document.getElementById('images').addEventListener('change', async function(e) {
        const files = e.target.files;
        if (files.length === 0) return;

        const formData = new FormData();
        for (let i = 0; i < files.length; i++) {
            formData.append('files', files[i]);
        }

        try {
            const resp = await fetch('/product/upload', {
                method: 'POST',
                body: formData
            });
            const result = await resp.json();
            if (result.code === 200) {
                uploadedImages = result.data;
                // 预览
                const previewDiv = document.getElementById('preview');
                previewDiv.innerHTML = '';
                uploadedImages.forEach(url => {
                    const img = document.createElement('img');
                    img.src = url;
                    previewDiv.appendChild(img);
                });
            } else {
                alert('图片上传失败');
            }
        } catch (err) {
            console.error(err);
            alert('上传出错');
        }
    });

    document.getElementById('submitBtn').addEventListener('click', async () => {
        const name = document.getElementById('name').value.trim();
        const category = document.getElementById('category').value;
        const price = parseFloat(document.getElementById('price').value);
        const originalPrice = document.getElementById('originalPrice').value ? parseFloat(document.getElementById('originalPrice').value) : null;
        const stock = parseInt(document.getElementById('stock').value);
        const conditionVal = document.getElementById('condition').value;
        const negotiable = document.getElementById('negotiable').value === 'true';
        const description = document.getElementById('description').value;

        if (!name || isNaN(price) || isNaN(stock)) {
            showMessage('请填写必填项', 'error');
            return;
        }

        const product = {
            name, category, price, originalPrice, stock,
            condition: conditionVal,
            negotiable,
            description,
            images: JSON.stringify(uploadedImages),
            imageUrl: uploadedImages.length > 0 ? uploadedImages[0] : null
        };

        try {
            const resp = await fetch('/product/publish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(product)
            });
            const result = await resp.json();
            if (result.code === 200) {
                showMessage('发布成功！', 'success');
                setTimeout(() => { window.location.href = '/my_products.html'; }, 1500);
            } else {
                showMessage(result.msg || '发布失败', 'error');
            }
        } catch (err) {
            showMessage('网络错误', 'error');
        }
    });

    function showMessage(msg, type) {
        const div = document.getElementById('message');
        div.textContent = msg;
        div.className = `message ${type}`;
        setTimeout(() => { div.textContent = ''; div.className = 'message'; }, 3000);
    }
</script>
</body>
</html>
