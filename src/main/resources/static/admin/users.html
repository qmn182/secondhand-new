<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 管理员</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #f2f2f2; }
        .btn { padding: 4px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-pass { background: #4caf50; color: white; }
        .btn-reject { background: #f44336; color: white; }
        .btn-refresh { background: #1890ff; color: white; margin-bottom: 10px; }
        .status-badge { padding: 2px 8px; border-radius: 12px; font-size: 12px; }
        .status-0 { background: #ff9800; color: white; }
        .status-1 { background: #4caf50; color: white; }
    </style>
</head>
<body>
<div class="container">
    <h2>用户管理（管理员）</h2>
    <button class="btn-refresh" id="refreshBtn">刷新列表</button>
    <table id="userTable">
        <thead>
            <tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>店铺名称</th><th>注册时间</th><th>操作</th></tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    async function loadUsers() {
        const resp = await fetch('/user/admin/list', { credentials: 'include' });
        const result = await resp.json();
        if (result.code === 200) {
            renderUsers(result.data);
        } else {
            alert('获取用户列表失败：' + result.msg);
        }
    }

    function renderUsers(users) {
        const tbody = document.querySelector('#userTable tbody');
        if (!users.length) {
            tbody.innerHTML = '<tr><td colspan="7">暂无用户</td></tr>';
            return;
        }
        tbody.innerHTML = users.map(user => `
            <tr>
                <td>${user.id}</td>
                <td>${user.username}</td>
                <td>${user.role === 1 ? '普通用户' : (user.role === 2 ? '商家' : '管理员')}</td>
                <td><span class="status-badge status-${user.status}">${user.status === 0 ? '待审核' : '已审核'}</span></td>
                <td>${user.shopName || '-'}</td>
                <td>${user.createTime ? new Date(user.createTime).toLocaleString() : '-'}</td>
                <td>
                    ${user.status === 0 ? `<button class="btn btn-pass" data-id="${user.id}">审核通过</button>` : '已通过'}
                </td>
            </tr>
        `).join('');

        // 绑定审核通过事件
        document.querySelectorAll('.btn-pass').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const userId = btn.dataset.id;
                const resp = await fetch(`/user/admin/audit?id=${userId}&status=1`, { method: 'GET', credentials: 'include' });
                const result = await resp.json();
                if (result.code === 200) {
                    alert('审核成功');
                    loadUsers();  // 刷新列表
                } else {
                    alert(result.msg);
                }
            });
        });
    }

    document.getElementById('refreshBtn').addEventListener('click', loadUsers);
    loadUsers();
</script>
</body>
</html>
