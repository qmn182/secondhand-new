<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的钱包</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .balance { text-align: center; font-size: 28px; color: #ff6b6b; margin: 20px 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #1890ff; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; font-size: 16px; }
        .btn-danger { background: #ff6b6b; }
        .message { margin-top: 15px; padding: 10px; border-radius: 4px; text-align: center; }
        .error { background: #ffebee; color: #f44336; }
        .success { background: #e8f5e9; color: #4caf50; }
        hr { margin: 20px 0; }
    </style>
</head>
<body>
<div class="container">
    <h2>我的钱包</h2>
    <div class="balance" id="balance">加载中...</div>
    
    <hr>
    <h3>充值</h3>
    <div class="form-group">
        <label>充值金额（元）</label>
        <input type="number" id="rechargeAmount" step="0.01" placeholder="请输入金额">
    </div>
    <div class="form-group">
        <label>银行卡密码</label>
        <input type="password" id="rechargePassword" placeholder="默认0000">
    </div>
    <button id="rechargeBtn">立即充值</button>

    <hr>
    <h3>提现</h3>
    <div class="form-group">
        <label>提现金额（元）</label>
        <input type="number" id="withdrawAmount" step="0.01" placeholder="请输入金额">
    </div>
    <div class="form-group">
        <label>银行卡密码</label>
        <input type="password" id="withdrawPassword" placeholder="默认0000">
    </div>
    <button id="withdrawBtn" class="btn-danger">提现</button>

    <div id="message" class="message"></div>
</div>

<script>
    // 获取当前余额并显示
    async function loadBalance() {
        try {
            const resp = await fetch('/user/wallet/balance', { credentials: 'include' });
            const result = await resp.json();
            if (result.code === 200) {
                document.getElementById('balance').innerText = '¥' + result.data;
            } else {
                document.getElementById('balance').innerText = '获取失败';
            }
        } catch (err) {
            document.getElementById('balance').innerText = '网络错误';
        }
    }

    // 充值
    async function recharge() {
        const amount = document.getElementById('rechargeAmount').value;
        const password = document.getElementById('rechargePassword').value;
        if (!amount || parseFloat(amount) <= 0) {
            showMessage('请输入有效金额', 'error');
            return;
        }
        if (!password) {
            showMessage('请输入银行卡密码', 'error');
            return;
        }
        try {
            const resp = await fetch(`/user/wallet/recharge?amount=${amount}&password=${password}`, {
                method: 'POST',
                credentials: 'include'
            });
            const result = await resp.json();
            if (result.code === 200) {
                showMessage(result.msg, 'success');
                loadBalance();  // 刷新余额
                document.getElementById('rechargeAmount').value = '';
                document.getElementById('rechargePassword').value = '';
            } else {
                showMessage(result.msg, 'error');
            }
        } catch (err) {
            showMessage('网络错误', 'error');
        }
    }

    // 提现
    async function withdraw() {
        const amount = document.getElementById('withdrawAmount').value;
        const password = document.getElementById('withdrawPassword').value;
        if (!amount || parseFloat(amount) <= 0) {
            showMessage('请输入有效金额', 'error');
            return;
        }
        if (!password) {
            showMessage('请输入银行卡密码', 'error');
            return;
        }
        try {
            const resp = await fetch(`/user/wallet/withdraw?amount=${amount}&password=${password}`, {
                method: 'POST',
                credentials: 'include'
            });
            const result = await resp.json();
            if (result.code === 200) {
                showMessage(result.msg, 'success');
                loadBalance();
                document.getElementById('withdrawAmount').value = '';
                document.getElementById('withdrawPassword').value = '';
            } else {
                showMessage(result.msg, 'error');
            }
        } catch (err) {
            showMessage('网络错误', 'error');
        }
    }

    function showMessage(msg, type) {
        const div = document.getElementById('message');
        div.textContent = msg;
        div.className = `message ${type}`;
        setTimeout(() => {
            div.textContent = '';
            div.className = 'message';
        }, 3000);
    }

    // 绑定事件
    document.getElementById('rechargeBtn').addEventListener('click', recharge);
    document.getElementById('withdrawBtn').addEventListener('click', withdraw);
    
    // 初始加载
    loadBalance();
</script>
</body>
</html>
